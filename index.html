<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101c1e" />
    <meta
      name="description"
      content="ReCall-SLAM — Remember globally. Reconstruct locally. Coming soon."
    />
    <title>ReCall-SLAM — Coming soon</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #101c1e;
        --foreground: #f0efe5;
        --muted: #a7b7b1;
        --line: rgba(202, 223, 208, 0.18);
        --accent: #d6ea88;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
      }

      .page {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        overflow: hidden;
      }

      .page::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background-image:
          linear-gradient(to right, var(--line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--line) 1px, transparent 1px);
        background-size: 88px 88px;
        content: "";
        mask-image: linear-gradient(90deg, transparent, black 46%, black);
        opacity: 0.32;
        pointer-events: none;
      }

      .shell {
        width: min(100% - 96px, 1440px);
        margin-inline: auto;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header {
        min-height: 104px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 15px;
        color: var(--foreground);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.035em;
        text-decoration: none;
      }

      .brand-mark {
        width: 25px;
        height: 25px;
        transform: rotate(-45deg);
        border: 3px solid var(--accent);
        border-right-color: transparent;
        border-radius: 50%;
      }

      .header-note,
      .eyebrow,
      footer {
        color: var(--muted);
        font-family: "Lucida Console", "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .header-note {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .header-note::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      main {
        display: grid;
        min-height: 650px;
        flex: 1;
        grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
        align-items: center;
        gap: 2vw;
        padding-block: 60px;
      }

      .copy {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 0 0 32px;
        color: var(--accent);
      }

      .eyebrow::before {
        width: 30px;
        height: 1px;
        background: var(--accent);
        content: "";
      }

      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
        font-size: clamp(76px, 9vw, 150px);
        font-weight: 400;
        letter-spacing: -0.075em;
        line-height: 0.91;
      }

      h1 span {
        display: block;
      }

      h1 span:last-child {
        color: var(--accent);
        font-style: italic;
      }

      .tagline {
        max-width: 450px;
        margin: 48px 0 0;
        padding-left: 22px;
        border-left: 1px solid var(--accent);
        color: var(--foreground);
        font-size: clamp(18px, 1.55vw, 22px);
        line-height: 1.5;
      }

      .detail {
        margin: 13px 0 0 23px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .diagram {
        position: relative;
        width: min(100%, 580px);
        margin-left: auto;
        aspect-ratio: 1;
      }

      .diagram svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .diagram .rings,
      .diagram .links {
        fill: none;
        stroke: #76918a;
        stroke-width: 1;
      }

      .diagram .rings {
        opacity: 0.42;
      }

      .diagram .links {
        stroke: var(--accent);
        stroke-dasharray: 5 8;
        opacity: 0.7;
        animation: drift 18s linear infinite;
      }

      .diagram .point {
        fill: var(--background);
        stroke: var(--accent);
        stroke-width: 2;
      }

      .diagram .core {
        fill: var(--accent);
      }

      .diagram-label {
        position: absolute;
        right: 7%;
        bottom: 7%;
        color: var(--muted);
        font-family: "Lucida Console", "Courier New", monospace;
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      footer {
        min-height: 76px;
        gap: 20px;
        border-top: 1px solid var(--line);
      }

      @keyframes drift {
        to { stroke-dashoffset: -104; }
      }

      @media (max-width: 850px) {
        .shell { width: min(100% - 48px, 1440px); }
        header { min-height: 80px; }
        main {
          min-height: 0;
          grid-template-columns: 1fr;
          gap: 12px;
          padding-block: 70px 30px;
        }
        .diagram {
          width: min(100%, 400px);
          margin: -20px auto 0;
        }
      }

      @media (max-width: 520px) {
        .shell { width: min(100% - 36px, 1440px); }
        .brand { font-size: 16px; }
        .header-note { font-size: 0; }
        h1 { font-size: clamp(64px, 15vw, 86px); }
        .eyebrow { margin-bottom: 26px; }
        .tagline { margin-top: 38px; }
        .diagram { width: min(100%, 340px); }
        footer { font-size: 9px; letter-spacing: 0.1em; }
      }

      @media (prefers-reduced-motion: reduce) {
        .diagram .links { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="shell">
        <a class="brand" href="./" aria-label="ReCall-SLAM home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>ReCall-SLAM</span>
        </a>
        <span class="header-note">Research in progress</span>
      </header>

      <main class="shell">
        <div class="copy">
          <p class="eyebrow">A new perspective on RGB-D SLAM</p>
          <h1><span>Coming</span><span>soon.</span></h1>
          <p class="tagline">Remember globally.<br />Reconstruct locally.</p>
          <p class="detail">The ReCall-SLAM website is on its way.</p>
        </div>

        <div class="diagram" aria-hidden="true">
          <svg viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg">
            <g class="rings">
              <circle cx="270" cy="270" r="211" />
              <circle cx="270" cy="270" r="157" />
              <circle cx="270" cy="270" r="103" />
              <circle cx="270" cy="270" r="49" />
              <path d="M270 27v486M27 270h486M99 99l342 342M441 99 99 441" />
            </g>
            <g class="links">
              <path d="M91 158 188 201 261 112 337 193 449 144" />
              <path d="M91 158 145 337 257 286 367 363 449 144" />
              <path d="M145 337 236 440 367 363 449 144" />
            </g>
            <g>
              <circle class="point" cx="91" cy="158" r="6" />
              <circle class="point" cx="188" cy="201" r="6" />
              <circle class="point" cx="261" cy="112" r="6" />
              <circle class="point" cx="337" cy="193" r="6" />
              <circle class="point" cx="449" cy="144" r="6" />
              <circle class="point" cx="145" cy="337" r="6" />
              <circle class="point" cx="257" cy="286" r="6" />
              <circle class="point" cx="367" cy="363" r="6" />
              <circle class="point" cx="236" cy="440" r="6" />
              <circle class="core" cx="270" cy="270" r="5" />
            </g>
          </svg>
          <span class="diagram-label">01 / Map in progress</span>
        </div>
      </main>

      <footer class="shell">
        <span>ReCall-SLAM</span>
        <span>Remember · Reconstruct · Return</span>
      </footer>
    </div>
  </body>
</html>
